<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Track Package - UPS Mini System</title>
    <style>
        form {
            margin-top: 20px;
        }

        label, input {
            display: block;
            margin-bottom: 10px;
        }

        input[type="text"] {
            width: 300px;
            padding: 6px;
        }

        button {
            padding: 6px 12px;
        }
    </style>
</head>
<body>
    <h1>Track a Package</h1>

    <form method="post">
        {% csrf_token %}
        <label for="tracking_number">Tracking Number:</label>
        <input type="text" id="tracking_number" name="tracking_number" required>

        <button type="submit">Track</button>
    </form>

    <p><a href="{% url 'home' %}">Back to Home</a></p>
</body>
</html>
