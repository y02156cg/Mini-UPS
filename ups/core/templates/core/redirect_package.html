<!-- redirect_package.html -->
{% extends "core/base.html" %}

{% block title %}Redirect Package - UPS Mini System{% endblock %}

{% block content %}
<h1>Redirect Package</h1>
<p><a href="{% url 'package_details' tracking_number=tracking_number %}">Back to Package Details</a> | <a href="{% url 'dashboard' %}">Dashboard</a></p>

<div class="card mt-4">
    <div class="card-header">
        <h2 class="mb-0">Tracking #{{ tracking_number }}</h2>
    </div>
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <div class="row">
                <div class="col-md-6">
                    <div class="mb-3">
                        <label for="new_x" class="form-label">New X Coordinate:</label>
                        <input type="number" class="form-control" id="new_x" name="new_x" required>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="mb-3">
                        <label for="new_y" class="form-label">New Y Coordinate:</label>
                        <input type="number" class="form-control" id="new_y" name="new_y" required>
                    </div>
                </div>
            </div>
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-location-arrow"></i> Submit Redirect
            </button>
        </form>
    </div>
</div>
{% endblock %}
